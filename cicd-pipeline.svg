<svg width="820" height="235" viewBox="0 0 820 235" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00A2FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <style>
      .title { font: 800 18px 'Segoe UI', system-ui, sans-serif; fill: #38BDF8; letter-spacing: 1.5px; }
      .host { font: bold 11.5px monospace; fill: #94A3B8; }
      .cmd { font: bold 12.5px monospace; }
      .ok { font: bold 12px monospace; fill: #22C55E; }

      .s1 { opacity: 0; animation: step1 7s infinite; }
      .s2 { opacity: 0; animation: step2 7s infinite; }
      .s3 { opacity: 0; animation: step3 7s infinite; }
      .s4 { opacity: 0; animation: step4 7s infinite; }

      .bar-fill {
        transform-box: fill-box;
        transform-origin: left center;
        transform: scaleX(0);
        animation: progress 7s infinite ease-in-out;
      }

      @keyframes step1 {
        0% { opacity: 0; }
        8%, 90% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes step2 {
        0%, 20% { opacity: 0; }
        28%, 90% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes step3 {
        0%, 42% { opacity: 0; }
        50%, 90% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes step4 {
        0%, 64% { opacity: 0; }
        72%, 90% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes progress {
        0% { transform: scaleX(0); }
        22% { transform: scaleX(0.25); }
        44% { transform: scaleX(0.5); }
        66% { transform: scaleX(0.75); }
        80%, 90% { transform: scaleX(1); }
        100% { transform: scaleX(0); }
      }
    </style>
  </defs>

  <text x="410" y="28" text-anchor="middle" class="title">LIVE DEPLOYMENT EXECUTION STREAM</text>

  <circle cx="82" cy="54" r="5" fill="#F43F5E" />
  <circle cx="98" cy="54" r="5" fill="#FBBF24" />
  <circle cx="114" cy="54" r="5" fill="#10B981" />
  <text x="410" y="58" text-anchor="middle" class="host">winmaniraja@cloud-ops:~/production-pipeline</text>
  <line x1="70" y1="68" x2="750" y2="68" stroke="#38BDF8" stroke-width="1" opacity="0.35" />

  <g class="s1">
    <text x="82" y="95" fill="#38BDF8" class="cmd">$ git push origin main</text>
    <text x="738" y="95" text-anchor="end" class="ok">[✔ Git Webhook Triggered]</text>
  </g>

  <g class="s2">
    <text x="82" y="122" fill="#818CF8" class="cmd">$ mvn clean package && jenkins build && docker push app:latest</text>
    <text x="738" y="122" text-anchor="end" class="ok">[✔ Image Built]</text>
  </g>

  <g class="s3">
    <text x="82" y="149" fill="#38BDF8" class="cmd">$ kubectl apply -f k8s-deploy.yaml --cloud=aws,gcp</text>
    <text x="738" y="149" text-anchor="end" class="ok">[✔ Cloud Deployed]</text>
  </g>

  <g class="s4">
    <text x="82" y="176" fill="#2DD4BF" class="cmd">$ prometheus --scrape-metrics && grafana-dashboard --live</text>
    <text x="738" y="176" text-anchor="end" class="ok">[✔ Monitored]</text>
  </g>

  <rect x="82" y="198" width="656" height="7" rx="3.5" fill="#94A3B8" opacity="0.25" />
  <rect x="82" y="198" width="656" height="7" rx="3.5" fill="url(#barGrad)" class="bar-fill" />
</svg>
