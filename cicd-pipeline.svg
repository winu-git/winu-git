<svg width="820" height="235" viewBox="0 0 820 235" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00A2FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <text x="410" y="28" text-anchor="middle" fill="#38BDF8" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5">
    LIVE DEPLOYMENT EXECUTION STREAM
  </text>

  <circle cx="82" cy="54" r="5" fill="#F43F5E" />
  <circle cx="98" cy="54" r="5" fill="#FBBF24" />
  <circle cx="114" cy="54" r="5" fill="#10B981" />
  <text x="410" y="58" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="bold">winmaniraja@cloud-ops:~/production-pipeline</text>
  <line x1="70" y1="68" x2="750" y2="68" stroke="#38BDF8" stroke-width="1" opacity="0.35" />

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="7s" repeatCount="indefinite" />
    <text x="82" y="95" fill="#38BDF8" font-family="monospace" font-size="12.5" font-weight="bold">$ git push origin main</text>
    <text x="738" y="95" text-anchor="end" fill="#22C55E" font-family="monospace" font-size="12" font-weight="bold">[✔ Git Webhook Triggered]</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.28;0.92;1" dur="7s" repeatCount="indefinite" />
    <text x="82" y="122" fill="#818CF8" font-family="monospace" font-size="12.5" font-weight="bold">$ mvn clean package && jenkins build && docker push app:latest</text>
    <text x="738" y="122" text-anchor="end" fill="#22C55E" font-family="monospace" font-size="12" font-weight="bold">[✔ Image Built]</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.50;0.92;1" dur="7s" repeatCount="indefinite" />
    <text x="82" y="149" fill="#38BDF8" font-family="monospace" font-size="12.5" font-weight="bold">$ kubectl apply -f k8s-deploy.yaml --cloud=aws,gcp</text>
    <text x="738" y="149" text-anchor="end" fill="#22C55E" font-family="monospace" font-size="12" font-weight="bold">[✔ Cloud Deployed]</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.72;0.92;1" dur="7s" repeatCount="indefinite" />
    <text x="82" y="176" fill="#2DD4BF" font-family="monospace" font-size="12.5" font-weight="bold">$ prometheus --scrape-metrics && grafana-dashboard --live</text>
    <text x="738" y="176" text-anchor="end" fill="#22C55E" font-family="monospace" font-size="12" font-weight="bold">[✔ Monitored]</text>
  </g>

  <rect x="82" y="198" width="656" height="7" rx="3.5" fill="#94A3B8" opacity="0.25" />
